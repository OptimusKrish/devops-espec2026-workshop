# Render Blueprint — deploys BOTH microservices with one click.
#
# Usage: Render dashboard -> New + -> Blueprint -> connect this repo ->
# Render reads this file and proposes both services -> Apply.
#
# This is the OPTIONAL fast path. The manual path (README section 6)
# walks the same result through Render's UI with no YAML at all, which
# is easier to narrate live in front of a room — use whichever you're
# more comfortable demoing.
#
# NOTE: after greeting-service's first deploy, copy its real public URL
# into portal-service's GREETING_URL env var below (or in the Render
# dashboard) if it differs from the guessed one — Render usually
# assigns https://<service-name>.onrender.com when that name is free,
# but falls back to a suffixed name if it's already taken.

services:
  - type: web
    name: greeting-service
    runtime: docker
    plan: free
    rootDir: services/greeting-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_VERSION
        value: v1

  - type: web
    name: portal-service
    runtime: docker
    plan: free
    rootDir: services/portal-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GREETING_URL
        value: https://greeting-service.onrender.com
        sync: false # confirm/update this in the Render dashboard after greeting-service's first deploy
