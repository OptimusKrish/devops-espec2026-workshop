# Render Blueprint — deploys BOTH microservices with one click.
#
# Usage: Render dashboard -> New + -> Blueprint -> connect this repo ->
# Render reads this file and proposes both services -> Apply.
#
# This is the OPTIONAL fast path. The manual path (README section 6)
# walks the same result through Render's UI with no YAML at all, which
# is easier to narrate live in front of a room — use whichever you're
# more comfortable demoing.
#
# NOTE: after greeting-service's first deploy, set portal-service's
# GREETING_URL in the Render dashboard to its actual public URL.

services:
  - type: web
    name: greeting-service
    runtime: docker
    plan: free
    rootDir: services/greeting-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_VERSION
        value: v1

  - type: web
    name: portal-service
    runtime: docker
    plan: free
    rootDir: services/portal-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GREETING_URL
        sync: false # set this in the Render dashboard after greeting-service's first deploy
